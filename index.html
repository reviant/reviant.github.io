<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Case Matcher</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .drag-active { border-color: #3b82f6 !important; background-color: #eff6ff !important; }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%;
            width: 24px; height: 24px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #debug-log { font-family: monospace; font-size: 11px; white-space: pre-wrap; }
        
        #toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 100;
        }
        .toast {
            background-color: #ef4444; color: white; padding: 1rem; border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 0.5rem; opacity: 0;
            transition: opacity 0.3s ease-in-out; max-width: 300px;
        }
        .toast-success { background-color: #16a34a; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

    <div id="toast-container"></div>

    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg"><i class="fa-solid fa-scale-balanced text-xl"></i></div>
                <h1 class="text-xl font-bold text-slate-800">Case Matcher For Doda District</h1>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="flex flex-col">
                <label class="block text-sm font-medium text-slate-700 mb-2">1. Master Case List (Apps Script)</label>
                <div class="flex-1 bg-white border border-slate-200 rounded-xl p-8 flex flex-col items-center justify-center text-center shadow-sm">
                    <i class="fa-brands fa-google-drive text-4xl text-green-600 mb-4"></i>
                    <button id="sync-sheet-btn" onclick="syncGoogleSheet()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-lg font-medium transition-colors shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-down"></i> Pull Data from Sheet
                    </button>
                </div>
                <div class="mt-3 flex items-center justify-between bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                    <div class="flex items-center">
                        <input type="checkbox" id="has-headers" checked class="w-4 h-4 text-blue-600 rounded">
                        <label for="has-headers" class="ml-2 text-sm text-gray-700">Sheet has Header Row</label>
                    </div>
                    <div id="csv-status" class="text-xs font-medium text-green-600 hidden flex items-center gap-2"><i class="fa-solid fa-check-circle"></i> <span id="csv-count">0</span> rows loaded</div>
                </div>
            </div>

            <div class="flex flex-col">
                <label class="block text-sm font-medium text-slate-700 mb-2">2. Cause List (PDF)</label>
                
                <div id="drop-zone-pdf" class="flex-1 relative border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:bg-slate-50 transition-colors cursor-pointer group bg-white">
                    <i class="fa-solid fa-file-pdf text-4xl text-slate-400 mb-3 block group-hover:text-red-500 transition-colors"></i>
                    <p class="text-sm text-slate-600 mb-4">Click here to upload PDFs</p>
                </div>
                
                <input type="file" id="pdf-input" accept=".pdf" multiple class="hidden">
                
                <ul id="file-list" class="mt-3 space-y-2"></ul>
                
                <button id="add-more-pdf-btn" onclick="document.getElementById('pdf-input').click()" class="mt-2 text-sm text-blue-600 font-medium hover:text-blue-800 hidden flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Add More PDFs
                </button>

                <div class="mt-3 p-3 bg-white rounded-lg border border-slate-200 shadow-sm min-h-[50px] flex items-center">
                    <div id="pdf-status" class="text-xs font-medium text-blue-600 hidden flex items-center gap-2">
                        <i class="fa-solid fa-check-circle"></i> <span id="pdf-count-status">0 PDF(s) Ready</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-center mb-8">
            <button id="process-btn" onclick="startProcessing()" disabled class="bg-slate-300 text-slate-500 cursor-not-allowed px-8 py-3 rounded-xl font-semibold shadow-sm transition-all flex items-center gap-2 text-lg w-full sm:w-auto justify-center">
                <span id="btn-icon"><i class="fa-solid fa-bolt"></i></span><span id="btn-text">Find Matches</span>
            </button>
        </div>

        <div id="progress-container" class="hidden max-w-2xl mx-auto mb-8">
            <div class="flex justify-between text-xs text-slate-500 mb-1"><span id="progress-text">Loading...</span><span id="progress-percent">0%</span></div>
            <div class="w-full bg-slate-200 rounded-full h-2.5"><div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div></div>
        </div>

        <div id="results-section" class="hidden">
            <div class="flex flex-col sm:flex-row justify-between items-end sm:items-center mb-4 gap-4 bg-green-50 p-4 rounded-xl border border-green-200">
                <div>
                    <h3 class="text-xl font-bold text-slate-800">Ready to Update</h3>
                    <p class="text-sm text-slate-600">Found <span id="match-count" class="font-bold text-green-700">0</span> matches.</p>
                </div>
                <button id="push-btn" onclick="pushUpdatesToSheet()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-lg font-medium transition-colors shadow-sm flex items-center gap-2 text-sm sm:text-base">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Update Live Sheet
                </button>
            </div>
            
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden overflow-x-auto mb-8">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500">
                        <tr>
                            <th class="px-4 py-3">Row No</th>
                            <th class="px-4 py-3 bg-purple-50">Item No</th>
                            <th class="px-4 py-3 bg-blue-50">Court No</th>
                            <th class="px-4 py-3">Justices</th>
                            <th class="px-4 py-3">Case Type & No</th>
                            <th class="px-4 py-3">Title</th>
                            <th class="px-4 py-3 bg-yellow-50">Date</th>
                        </tr>
                    </thead>
                    <tbody id="results-body" class="divide-y divide-slate-200"></tbody>
                </table>
            </div>
        </div>

        <div class="max-w-7xl mx-auto">
            <button onclick="document.getElementById('debug-container').classList.toggle('hidden')" class="text-xs text-slate-500 underline mb-2">Show Debug Log</button>
            <div id="debug-container" class="hidden bg-slate-900 text-green-400 p-4 rounded-lg shadow-inner h-64 overflow-y-auto">
                <div id="debug-log">Ready...</div>
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE V49
        // ==========================================
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyuthxtz-QYwrFLhW7JLNGb9ocT56dA1-nKoOfGJ_I930kqRE74GQkCNEdjoT1hORpg/exec";
        // ==========================================

        window.onload = function() {
            if (typeof pdfjsLib !== 'undefined') {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }
        };

        function showMessage(message, isSuccess = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast' + (isSuccess ? ' toast-success' : '');
            toast.innerText = message;
            container.appendChild(toast);
            void toast.offsetWidth;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
            log((isSuccess ? "SUCCESS: " : "ERROR: ") + message);
        }

        let sheetDataRaw = [], pdfFiles = [], processedResults = [];

        function log(msg) { const div = document.getElementById('debug-log'); div.innerText += "\n" + msg; div.scrollTop = div.scrollHeight; }

        document.getElementById('drop-zone-pdf').addEventListener('click', () => document.getElementById('pdf-input').click());
        
        document.getElementById('pdf-input').addEventListener('change', function() {
            if(this.files.length > 0) {
                const newFiles = Array.from(this.files);
                pdfFiles = pdfFiles.concat(newFiles);
                updateFileListUI();
                this.value = ''; 
            }
        });

        function removeFile(index) {
            pdfFiles.splice(index, 1);
            updateFileListUI();
        }

        function updateFileListUI() {
            const list = document.getElementById('file-list');
            const addMoreBtn = document.getElementById('add-more-pdf-btn');
            const status = document.getElementById('pdf-status');
            const countStatus = document.getElementById('pdf-count-status');
            const dropZone = document.getElementById('drop-zone-pdf');
            
            list.innerHTML = '';
            
            if (pdfFiles.length > 0) {
                dropZone.classList.add('hidden');
                addMoreBtn.classList.remove('hidden');
                status.classList.remove('hidden');
                countStatus.textContent = pdfFiles.length + " PDF(s) Ready";
                
                pdfFiles.forEach((file, index) => {
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center bg-white p-3 rounded-lg border border-slate-200 shadow-sm text-sm";
                    li.innerHTML = `
                        <span class="truncate font-medium text-slate-700 flex items-center gap-3"><i class="fa-solid fa-file-pdf text-red-500 text-lg"></i> ${file.name}</span>
                        <button onclick="removeFile(${index})" class="text-slate-400 hover:text-red-600 transition-colors px-2 py-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                    `;
                    list.appendChild(li);
                });
            } else {
                dropZone.classList.remove('hidden');
                addMoreBtn.classList.add('hidden');
                status.classList.add('hidden');
            }
            checkReady();
        }

        async function syncGoogleSheet() {
            if (GOOGLE_WEB_APP_URL === "YOUR_WEB_APP_URL_HERE" || !GOOGLE_WEB_APP_URL) {
                showMessage("Please put your Web App URL in the code.");
                return;
            }

            const btn = document.getElementById('sync-sheet-btn');
            const originalHTML = btn.innerHTML;
            const statusDiv = document.getElementById('csv-status');
            
            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading Data...';
                
                const response = await fetch(GOOGLE_WEB_APP_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                sheetDataRaw = [];
                const hasHeaders = document.getElementById('has-headers').checked;
                
                data.forEach((row, index) => {
                    if (hasHeaders && index === 0) return; 
                    sheetDataRaw.push({
                        _original: row,
                        rowIndex: index + 1
                    });
                });
                
                document.getElementById('csv-count').textContent = sheetDataRaw.length;
                statusDiv.classList.remove('hidden');
                checkReady();
                log("Data pulled. Rows: " + sheetDataRaw.length);

            } catch (error) {
                showMessage("Error: " + error.message);
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        }

        function checkReady() {
            if (sheetDataRaw.length > 0 && pdfFiles.length > 0) {
                document.getElementById('process-btn').disabled = false;
                document.getElementById('process-btn').classList.remove('bg-slate-300', 'text-slate-500', 'cursor-not-allowed');
                document.getElementById('process-btn').classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white');
            } else {
                document.getElementById('process-btn').disabled = true;
                document.getElementById('process-btn').classList.add('bg-slate-300', 'text-slate-500', 'cursor-not-allowed');
                document.getElementById('process-btn').classList.remove('bg-blue-600', 'hover:bg-blue-700', 'text-white');
            }
        }

        function normalizeCaseString(text) { return String(text || "").replace(/[^a-zA-Z0-9]/g, '').toUpperCase(); }

        function getBenchVariants(type, num) {
            const variants = [`${type}-${num}`];
            const map = {'1':'I','2':'II','3':'III','4':'IV','5':'V','6':'VI','I':'1','II':'2','III':'3','IV':'4','V':'5','VI':'6','11':'II'};
            if (map[num]) variants.push(`${type}-${map[num]}`);
            return variants;
        }

        function shortenJusticeName(fullName, benchNo) {
            if (!fullName || fullName === "-") return "-";
            const upper = fullName.toUpperCase();
            if (upper.includes("&") || upper.includes(" AND ")) return (benchNo && benchNo !== "-") ? benchNo : fullName;
            if (upper.includes("REGISTRAR JUDICIAL")) return "Registrar Judicial";
            let cleaned = fullName.replace(/HON'BLE|MR\.|MRS\.|MS\.|JUSTICE|\bMR\b|\bMS\b|\bMRS\b/gi, "");
            return cleaned.replace(/\s+/g, " ").trim();
        }

        // --- UPGRADED SMART TEXT SCANNING INDEX BUILDER ---
        function buildTextScanningBenchMap(items) {
            const map = {};
            // Using reconstructLinesV5 ensures we read the table row-by-row, 
            // preventing the PDF reader from scrambling columns.
            const lines = reconstructLinesV5(items);
            const rawText = lines.join(" ").replace(/\s+/g, " ").toUpperCase();
            
            const regex = /(DB|SB)\s*[-–]?\s*([IVX0-9]+)/gi;
            let match;
            
            while ((match = regex.exec(rawText)) !== null) {
                const type = match[1].toUpperCase();
                const num = match[2].toUpperCase();
                
                // Expanded chunk size to 80 characters to capture grouped headers cleanly
                let chunk = rawText.substring(match.index, match.index + 80).toUpperCase();
                
                // Truncate if it hits the next bench so courts aren't mixed up
                const nextBench = chunk.substring(5).search(/(?:\s|^)(DB|SB)\s*[-–]?\s*[IVX0-9]+/);
                if (nextBench !== -1) {
                    chunk = chunk.substring(0, nextBench + 5);
                }
                
                let courtNum = "-";
                // Match patterns like "COURT NO. 5", "COURT 5", or "5) COURT"
                const courtMatch = chunk.match(/COURT[^\d]{1,15}(\d+)|(\d+)[^\d]{1,15}COURT/);
                if (courtMatch) {
                    courtNum = courtMatch[1] || courtMatch[2];
                }
                
                getBenchVariants(type, num).forEach(v => { 
                    map[v] = { court: courtNum, justices: "-" }; 
                });
            }
            
            if (!map["DB-I"]) map["DB-I"] = { court: "1", justices: "-" };
            if (!map["SB-I"]) map["SB-I"] = { court: "1", justices: "-" };
            return map;
        }

        function reconstructLinesV5(items) {
            const yTolerance = 5; const linesMap = {};
            items.forEach(item => {
                const y = item.transform[5]; let foundKey = null;
                for (const key in linesMap) { if (Math.abs(parseFloat(key) - y) < yTolerance) { foundKey = key; break; } }
                if (foundKey) linesMap[foundKey].push(item); else linesMap[y] = [item];
            });
            return Object.keys(linesMap).sort((a, b) => parseFloat(b) - parseFloat(a)).map(y => {
                const lineItems = linesMap[y].sort((a, b) => a.transform[4] - b.transform[4]);
                let str = "", lastX = 0, lastWidth = 0;
                lineItems.forEach(item => {
                    if (lastX > 0 && (item.transform[4] - (lastX + lastWidth)) > 5) str += " ";
                    str += item.str; lastX = item.transform[4]; lastWidth = item.width;
                });
                return str.trim();
            });
        }

        async function startProcessing() {
            const btn = document.getElementById('process-btn');
            const progressBar = document.getElementById('progress-bar');
            const statusText = document.getElementById('progress-text');

            btn.disabled = true;
            statusText.textContent = "Loading PDFs into memory...";
            document.getElementById('progress-container').classList.remove('hidden');
            document.getElementById('results-section').classList.add('hidden');

            const caseMap = {};
            let globalHasIndex = false;
            let globalBenchCourtMap = {};
            let globalCauseListDate = "-";

            try {
                let loadedPdfs = [];
                for (let i = 0; i < pdfFiles.length; i++) {
                    const file = pdfFiles[i];
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    loadedPdfs.push({ file: file, pdf: pdf });
                }

                statusText.textContent = "Scanning for Master Index...";
                
                for (let item of loadedPdfs) {
                    const pdf = item.pdf;
                    for(let pg = 1; pg <= Math.min(5, pdf.numPages); pg++) {
                        const page = await pdf.getPage(pg);
                        const textContent = await page.getTextContent();
                        
                        const rawText = textContent.items.map(i => i.str).join(" ").toUpperCase();
                        const rawTextNoSpace = rawText.replace(/\s+/g, ''); 
                        
                        // Robust master index verification logic
                        const isMasterIndex = rawTextNoSpace.includes("REGULARCAUSELIST") && 
                                             (rawTextNoSpace.includes("BENCH") || rawTextNoSpace.includes("COURTNO"));

                        if (isMasterIndex) {
                            log("Found Master Index in: " + item.file.name);
                            globalHasIndex = true;
                            
                            // Build map via Row-by-Row Reconstruction
                            globalBenchCourtMap = buildTextScanningBenchMap(textContent.items);
                            
                            const dateMatch = rawText.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
                            if(dateMatch) {
                                let y = dateMatch[3];
                                if (y.length === 4) y = y.substring(2);
                                globalCauseListDate = `${dateMatch[1].padStart(2,'0')}/${dateMatch[2].padStart(2,'0')}/${y}`;
                            }
                            break;
                        }
                    }
                    if (globalHasIndex) break; 
                }

                if (!globalHasIndex) {
                    log("No Master Index found in any file. Will use SL for courts.");
                }

                statusText.textContent = "Extracting Cases...";

                for (let fileIndex = 0; fileIndex < loadedPdfs.length; fileIndex++) {
                    const pdf = loadedPdfs[fileIndex].pdf;
                    const allPages = [];
                    let currentActiveItemNo = "-"; 
                    let currentCaseObj = null;
                    let currentActiveDate = globalCauseListDate; 

                    for (let i = 1; i <= pdf.numPages; i++) {
                        let totalProgress = ((fileIndex / loadedPdfs.length) * 100) + ((i / pdf.numPages) * (100 / loadedPdfs.length) * 0.8);
                        progressBar.style.width = `${Math.round(totalProgress)}%`;
                        
                        const textContent = await (await pdf.getPage(i)).getTextContent();
                        const lines = reconstructLinesV5(textContent.items);
                        
                        let pageObj = { pageNum: i, benchStart: null, headerCourt: null, justices: [], cases: [], pageDate: null };

                        const headerItems = textContent.items.filter(item => item.transform[5] > 600);
                        const headerString = headerItems.sort((a,b) => b.transform[5] - a.transform[5] || a.transform[4] - b.transform[4]).map(i => i.str.toUpperCase()).join(" ");
                        
                        if (headerString.includes("REGISTRAR JUDICIAL")) { pageObj.justices.push("REGISTRAR JUDICIAL"); pageObj.headerCourt = "RJ"; }
                        
                        const pDateMatch = headerString.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
                        if (pDateMatch) {
                            let y = pDateMatch[3];
                            if (y.length === 4) y = y.substring(2);
                            currentActiveDate = `${pDateMatch[1].padStart(2,'0')}/${pDateMatch[2].padStart(2,'0')}/${y}`;
                        }

                        if (globalHasIndex) {
                            const fallbackMatch = headerString.match(/COURT\s*(?:NO\.?)?\s*(\d+)/);
                            if (fallbackMatch && !headerString.includes("HIGH")) {
                                pageObj.headerCourt = fallbackMatch[1];
                            } else {
                                for (let j = 0; j < headerItems.length; j++) {
                                    let text = headerItems[j].str.trim();
                                    if (/^\d{1,2}$/.test(text) && headerItems[j].transform[5] > 700) {
                                        pageObj.headerCourt = text;
                                        break;
                                    }
                                }
                            }
                        }

                        for (let j = 0; j < lines.length; j++) {
                            const line = lines[j];
                            const upper = line.toUpperCase();

                            if (upper.includes("BENCH NO")) {
                                currentCaseObj = null;
                                const m = line.match(/BENCH\s*NO[.:\s]*([A-Z0-9-]+)/i);
                                if(m) { 
                                    let bId = m[1].trim().toUpperCase().replace("-11", "-II").replace("-1", "-I");
                                    pageObj.benchStart = bId; currentActiveItemNo = "-"; 
                                }
                                continue; 
                            }
                            if (upper.includes("HON'BLE")) { currentCaseObj = null; pageObj.justices.push(line.trim()); continue; }
                            if (upper.includes("REGISTRAR JUDICIAL")) { pageObj.justices.push("REGISTRAR JUDICIAL"); }

                            const explicitMatch = line.match(/^(\d+)\s+([A-Za-z0-9\.\(\)\s\-\&]+?\d+\/\d+)\s*(.*)/i);
                            if (explicitMatch) {
                                currentActiveItemNo = explicitMatch[1];
                                currentCaseObj = { itemNo: currentActiveItemNo, cleanId: normalizeCaseString(explicitMatch[2]), pdfTitle: explicitMatch[3].trim() };
                                pageObj.cases.push(currentCaseObj); continue;
                            }

                            const cleanLine = line.replace(/^c\/w\s*/i, "").trim();
                            const implicitMatch = cleanLine.match(/^([A-Za-z0-9\.\(\)\s\-\&]+?\d+\/\d+)\s*(.*)/i);
                            if (implicitMatch && currentActiveItemNo !== "-" && (line.toLowerCase().startsWith('c/w') || cleanLine.length > 5)) {
                                 if (cleanLine.match(/[A-Z]/) && cleanLine.match(/\d+\/\d+/)) {
                                     currentCaseObj = { itemNo: currentActiveItemNo, cleanId: normalizeCaseString(implicitMatch[1]), pdfTitle: implicitMatch[2].trim() };
                                    pageObj.cases.push(currentCaseObj); continue;
                                 }
                            }
                            if (currentCaseObj && !line.match(/^Page No/i) && !line.match(/^\d+$/) && currentCaseObj.pdfTitle.length < 500) {
                                currentCaseObj.pdfTitle += " " + line.trim();
                            }
                        }
                        pageObj.assignedDate = currentActiveDate;
                        allPages.push(pageObj);
                    }

                    let currentBench = "-", currentCourt = "-", currentJustices = "-";

                    for (let i = 0; i < allPages.length; i++) {
                        const p = allPages[i], nextP = allPages[i+1];
                        
                        if (!globalHasIndex) {
                            currentCourt = "SL";
                            if (p.justices.length > 0) {
                                currentJustices = p.justices.join(" & ");
                            }
                        } else {
                            if (p.benchStart) {
                                currentBench = p.benchStart; currentJustices = "-"; 
                                let mapInfo = globalBenchCourtMap[currentBench.replace(/[^A-Z0-9-]/g, "")];
                                if (mapInfo) {
                                    currentCourt = mapInfo.court;
                                    if (mapInfo.justices && mapInfo.justices !== "-") {
                                        currentJustices = mapInfo.justices;
                                    } else if (p.justices.length > 0) {
                                        currentJustices = p.justices.join(" & ");
                                    }
                                } else {
                                    currentCourt = (nextP && !nextP.benchStart && nextP.headerCourt) ? nextP.headerCourt : (p.headerCourt || "-");
                                    if (p.justices.length > 0) currentJustices = p.justices.join(" & ");
                                }
                            } else if (!currentCourt || currentCourt === "-") {
                                if (p.headerCourt) currentCourt = p.headerCourt;
                            }
                            if ((!currentJustices || currentJustices === "-") && p.justices.length > 0) {
                                currentJustices = p.justices.join(" & ");
                            }
                        }
                        
                        p.cases.forEach(c => {
                            caseMap[c.cleanId] = { item: c.itemNo, court: currentCourt, justices: currentJustices, bench: currentBench, date: p.assignedDate };
                        });
                    }
                }

                progressBar.style.width = "100%";

                processedResults = [];
                
                sheetDataRaw.forEach(rowObj => {
                    const vals = rowObj._original;
                    const rowIndex = rowObj.rowIndex;
                    
                    const cType = vals[5] ? String(vals[5]).trim() : "";
                    const cNum = vals[6] ? String(vals[6]).trim() : "";
                    const sheetTitle = vals[7] ? String(vals[7]).trim() : "";

                    const searchId = normalizeCaseString(cType + cNum);
                    const match = caseMap[searchId];

                    if (match) {
                        processedResults.push({
                            rowIndex: rowIndex, 
                            status: "Exact",
                            itemNo: match.item,
                            courtNo: match.court,
                            justices: shortenJusticeName(match.justices, match.bench),
                            csvCaseNo: `${cType} ${cNum}`,
                            sheetTitle: sheetTitle,
                            date: match.date
                        });
                    }
                });

                renderResults();

            } catch (error) {
                showMessage("Error: " + error.message);
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }

        function renderResults() {
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';
            
            processedResults.forEach(res => {
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-slate-50 text-xs sm:text-sm";
                tr.innerHTML = `
                    <td class="px-4 py-3 font-mono text-slate-500 font-bold border-r border-slate-200">#${res.rowIndex}</td>
                    <td class="px-4 py-3 bg-purple-50 text-purple-700 font-bold">${res.itemNo}</td>
                    <td class="px-4 py-3 bg-blue-50 text-blue-700 font-bold">${res.courtNo}</td>
                    <td class="px-4 py-3 text-gray-700 font-medium">${res.justices}</td>
                    <td class="px-4 py-3 font-medium">${res.csvCaseNo}</td>
                    <td class="px-4 py-3 text-gray-500 text-xs max-w-xs truncate" title="${res.sheetTitle}">${res.sheetTitle}</td>
                    <td class="px-4 py-3 font-mono text-slate-700 bg-yellow-50">${res.date}</td>
                `;
                tbody.appendChild(tr);
            });
            
            document.getElementById('match-count').textContent = processedResults.length;
            document.getElementById('results-section').classList.remove('hidden');
            document.getElementById('progress-container').classList.add('hidden');
        }

        async function pushUpdatesToSheet() {
            const btn = document.getElementById('push-btn');
            const originalHTML = btn.innerHTML;
            
            if (processedResults.length === 0) {
                showMessage("No updates to push.");
                return;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';
                
                const payload = processedResults.map(res => {
                    return {
                        row: res.rowIndex, 
                        itemNo: isNaN(Number(res.itemNo)) ? res.itemNo : Number(res.itemNo),
                        courtNo: isNaN(Number(res.courtNo)) ? res.courtNo : Number(res.courtNo),
                        justices: res.justices,
                        date: res.date
                    };
                });

                const response = await fetch(GOOGLE_WEB_APP_URL, {
                    method: 'POST',
                    redirect: 'follow', 
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8", 
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (result.status === "success") {
                    showMessage("Successfully updated live Google Sheet!", true);
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Sheet Updated';
                    btn.classList.replace('bg-green-600', 'bg-slate-400');
                } else {
                    throw new Error(result.message);
                }

            } catch (error) {
                showMessage("Error pushing updates: " + error.message);
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        }
    </script>
</body>
</html>
